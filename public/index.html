<!doctype html>
<html lang="en" class="scheme-light dark:scheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messenger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236366f1'/%3E%3C/svg%3E">

  <!-- Apply the saved (or OS) theme before first paint, so the page never flashes the wrong theme. -->
  <script>
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch {}
  </script>
  <!-- Tailwind's browser build styles the page only after it compiles; paint the theme background before that. -->
  <style>
    html { background: #f1f5f9; color-scheme: light; }
    html.dark { background: #020617; color-scheme: dark; }
  </style>

  <!-- integrity: the browser refuses the file if the CDN serves different bytes. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
          integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB" crossorigin="anonymous"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    /* Frosted panel. Opaque enough that text keeps its contrast over the background blobs. */
    @utility glass {
      @apply border border-white/60 bg-white/70 shadow-xl shadow-slate-900/5 backdrop-blur-xl;
      @apply dark:border-white/10 dark:bg-slate-900/65 dark:shadow-black/30;

      @media (prefers-reduced-transparency: reduce) {
        @apply bg-white backdrop-blur-none dark:bg-slate-900;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.4/dist/ws.min.js"
          integrity="sha384-1RwI/nvUSrMRuNj7hX1+27J8XDdCoSLf0EjEyF69nacuWyiJYoQ/j39RT1mSnd2G" crossorigin="anonymous"></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/chat.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>

<body class="min-h-dvh bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <!-- Decorative background the glass panels blur. -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -left-24 size-96 rounded-full bg-indigo-400/50 blur-3xl dark:bg-indigo-600/30"></div>
    <div class="absolute top-1/3 -right-24 size-[28rem] rounded-full bg-fuchsia-400/40 blur-3xl dark:bg-fuchsia-700/25"></div>
    <div class="absolute -bottom-32 left-1/4 size-[26rem] rounded-full bg-sky-300/50 blur-3xl dark:bg-cyan-600/20"></div>
  </div>

  <button type="button" data-theme-toggle aria-pressed="false"
          class="glass fixed top-4 right-4 z-10 grid size-11 place-items-center rounded-full text-slate-700 transition hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:text-slate-300 dark:hover:text-white dark:focus-visible:outline-indigo-400">
    <span class="sr-only">Dark mode</span>
    <svg class="size-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg class="hidden size-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>

  <!-- Every screen is swapped into #app. -->
  <main id="app" class="mx-auto grid min-h-dvh w-full max-w-2xl place-items-center px-4 py-16">
    <section class="glass w-full max-w-md rounded-3xl p-6 sm:p-10" aria-labelledby="login-title">
      <div class="mb-8 flex items-center gap-3">
        <span class="grid size-11 place-items-center rounded-2xl bg-linear-to-br from-indigo-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30" aria-hidden="true">
          <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>
          </svg>
        </span>
        <span class="text-lg font-semibold tracking-tight">Messenger</span>
      </div>

      <h1 id="login-title" class="text-2xl font-semibold tracking-tight">Join the conversation</h1>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Pick a username. No account, no password.</p>

      <!-- No request: messenger-be has no /login, so js/login.js opens the chat in the browser. -->
      <form data-login-form class="mt-8 space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium">Username</label>
          <input id="username" name="username" type="text"
                 required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
                 autocomplete="username" autocapitalize="none" spellcheck="false" autofocus
                 aria-describedby="username-hint username-error"
                 hx-on:input="this.removeAttribute('aria-invalid'); document.getElementById('username-error').textContent = ''"
                 placeholder="e.g. ada_lovelace"
                 class="mt-2 block w-full rounded-xl border border-slate-300 bg-white/80 px-4 py-3 text-base shadow-sm outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/25 aria-[invalid=true]:border-rose-500! aria-[invalid=true]:focus:ring-rose-500/25 dark:border-white/15 dark:bg-slate-950/50 dark:placeholder:text-slate-400 dark:focus:border-indigo-400">
          <p id="username-hint" class="mt-2 text-xs text-slate-600 dark:text-slate-400">3–20 characters: letters, numbers or _</p>
          <!-- js/login.js fills this when the username is invalid. aria-live makes screen readers announce
               it, but only if the region is already rendered, so it must never be display:none. -->
          <p id="username-error" aria-live="polite" class="mt-2 text-sm font-medium text-rose-700 empty:mt-0 dark:text-rose-300"></p>
        </div>

        <button type="submit"
                class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-linear-to-r from-indigo-600 to-violet-600 px-4 py-3 font-semibold text-white shadow-lg shadow-indigo-600/25 transition hover:from-indigo-700 hover:to-violet-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 active:scale-[.99] motion-reduce:transition-none dark:focus-visible:outline-indigo-400">
          Join
        </button>
      </form>
    </section>
  </main>

  <!-- Chat screen. js/login.js copies it into #app after login; htmx then opens the socket.
       ws-connect: messenger-be, which only listens on 127.0.0.1:3000. -->
  <template id="chat-screen">
    <section data-chat hx-ext="ws" ws-connect="ws://127.0.0.1:3000/ws" aria-labelledby="chat-title"
             class="group/chat glass flex h-[min(44rem,calc(100dvh-8rem))] w-full flex-col overflow-hidden rounded-3xl">
      <header class="flex items-center justify-between gap-4 border-b border-slate-900/10 px-5 py-4 dark:border-white/10">
        <div class="min-w-0">
          <h1 id="chat-title" class="text-lg font-semibold tracking-tight">Chat</h1>
          <p class="truncate text-sm text-slate-600 dark:text-slate-300">Signed in as <strong data-chat-username class="font-semibold text-slate-900 dark:text-white"></strong></p>
        </div>
        <p class="flex shrink-0 items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
          <span aria-hidden="true" class="size-2 rounded-full bg-amber-500 group-data-[status=open]/chat:bg-emerald-500"></span>
          <span data-chat-status role="status">Connecting…</span>
        </p>
      </header>

      <!-- role=log: screen readers announce new messages. tabindex: keyboard users can scroll it. -->
      <div data-chat-log role="log" aria-label="Messages" tabindex="0"
           class="group/log flex-1 overflow-y-auto px-4 py-5 outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-500 sm:px-5">
        <p class="grid h-full place-items-center text-center text-sm text-slate-600 group-has-[li]/log:hidden dark:text-slate-400">No messages yet. Say hi!</p>
        <ol data-chat-messages class="space-y-3"></ol>
      </div>

      <template data-chat-message-template>
        <li class="group/msg flex flex-col items-start data-mine:items-end">
          <span data-chat-author class="mb-1 px-1 text-xs font-medium text-slate-600 dark:text-slate-400"></span>
          <p data-chat-text class="max-w-[85%] rounded-2xl rounded-bl-md bg-white px-4 py-2 break-words whitespace-pre-wrap text-slate-900 shadow-sm group-data-mine/msg:rounded-br-md group-data-mine/msg:rounded-bl-2xl group-data-mine/msg:bg-indigo-600 group-data-mine/msg:text-white dark:bg-slate-800 dark:text-slate-100 dark:group-data-mine/msg:bg-indigo-500"></p>
        </li>
      </template>

      <form ws-send class="flex gap-2 border-t border-slate-900/10 p-3 dark:border-white/10">
        <label for="message" class="sr-only">Message</label>
        <input id="message" name="message" type="text" required maxlength="2000" autocomplete="off" autofocus
               placeholder="Write a message…"
               class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white/80 px-4 py-3 text-base shadow-sm outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/25 dark:border-white/15 dark:bg-slate-950/50 dark:placeholder:text-slate-400 dark:focus:border-indigo-400">
        <!-- Enabled by js/chat.js once the socket is open. -->
        <button type="submit" data-chat-send disabled
                class="rounded-xl bg-linear-to-r from-indigo-600 to-violet-600 px-5 font-semibold text-white shadow-lg shadow-indigo-600/25 transition hover:from-indigo-700 hover:to-violet-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none dark:focus-visible:outline-indigo-400">
          Send
        </button>
      </form>
    </section>
  </template>

  <!-- Network/server errors for any screen. role=alert announces new text immediately.
       Hidden with opacity, not display:none, so screen readers keep watching it. -->
  <p id="app-error" role="alert"
     class="glass fixed inset-x-4 bottom-4 z-20 mx-auto max-w-md rounded-2xl px-4 py-3 text-sm font-medium text-rose-700 empty:pointer-events-none empty:opacity-0 dark:text-rose-300"></p>
</body>
</html>
